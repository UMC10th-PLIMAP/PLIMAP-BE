name: "✨ Feature"
description: "새로운 기능을 제안하거나 구현 작업을 등록합니다."
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: "배경 및 목적"
      description: "이 기능이 필요한 이유와 해결하려는 문제를 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "기능 설명"
      description: "구현할 기능과 예상 동작을 구체적으로 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "세부 작업"
      description: "필요한 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "추가 정보"
      description: "참고 자료, 화면 설계, 관련 링크 등이 있다면 작성해 주세요."
    validations:
      required: false
