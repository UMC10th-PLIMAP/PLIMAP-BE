name: "♻️ Refactor"
description: "기능 변경 없이 코드 구조와 품질을 개선하는 작업을 등록합니다."
title: "[Refactor] "
labels:
  - refactor
body:
  - type: textarea
    id: background
    attributes:
      label: "개선 배경"
      description: "리팩터링이 필요한 이유와 현재 코드의 문제를 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "개선 내용"
      description: "변경할 구조나 로직을 구체적으로 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "세부 작업"
      description: "진행할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "영향 범위"
      description: "영향을 받는 기능, 모듈 또는 테스트 항목을 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "추가 정보"
      description: "참고 자료나 관련 링크가 있다면 작성해 주세요."
    validations:
      required: false
