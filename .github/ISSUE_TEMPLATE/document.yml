name: "📝 Document"
description: "문서 작성, 수정 또는 보완 작업을 등록합니다."
title: "[Document] "
labels:
  - documentation
body:
  - type: textarea
    id: target
    attributes:
      label: "대상 문서"
      description: "작성하거나 수정할 문서와 위치를 작성해 주세요."
      placeholder: "예: README.md, API 명세서"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "작업 내용"
      description: "추가, 수정 또는 삭제할 내용을 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "세부 작업"
      description: "필요한 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "추가 정보"
      description: "참고 자료나 관련 링크가 있다면 작성해 주세요."
    validations:
      required: false
