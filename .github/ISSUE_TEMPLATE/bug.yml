name: "🐛 Bug"
description: "오류 또는 예상과 다르게 동작하는 문제를 제보합니다."
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: "문제 설명"
      description: "어떤 문제가 발생했는지 명확하게 작성해 주세요."
      placeholder: "발생한 문제를 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "재현 방법"
      description: "문제를 재현할 수 있는 순서를 작성해 주세요."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "기대 동작"
      description: "정상적으로 기대한 동작을 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "실행 환경"
      description: "OS, 브라우저, 애플리케이션 버전 등 관련 환경을 작성해 주세요."
      placeholder: "예: Windows 11, Chrome 126"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "추가 정보"
      description: "로그, 스크린샷 등 참고할 내용을 첨부해 주세요."
    validations:
      required: false
