name: "✅ Task"
description: "기능 외 일반 작업이나 유지보수 작업을 등록합니다."
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: purpose
    attributes:
      label: "작업 목적"
      description: "이 작업이 필요한 이유를 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "세부 작업"
      description: "진행할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: "완료 조건"
      description: "작업을 완료했다고 판단할 수 있는 기준을 작성해 주세요."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "추가 정보"
      description: "참고할 내용이나 관련 링크가 있다면 작성해 주세요."
    validations:
      required: false
