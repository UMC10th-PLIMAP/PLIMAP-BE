name: plimap-local

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: plimap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-plimap_local_db}
      POSTGRES_USER: ${DB_USERNAME:-plimap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plimap1234}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-plimap} -d ${DB_NAME:-plimap_local_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
