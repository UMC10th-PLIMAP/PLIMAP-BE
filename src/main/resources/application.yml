# PLIMAP 공통 환경 설정
# local, dev, prod 등 모든 실행 환경에서 공통으로 사용하는 값만 작성합니다.

spring:
  application:
    name: "PLIMAP"
  # flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_REST_API_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: "https://kauth.kakao.com/oauth/authorize"
            token-uri: "https://kauth.kakao.com/oauth/token"
            user-info-uri: "https://kapi.kakao.com/v2/user/me"
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}

# 프론트/백엔드가 서로 다른 도메인이므로 cross-site 쿠키 전송을 위해 SameSite=None + Secure=true가 기본값
# (local만 http://localhost 간 same-site 통신이라 application-local.yml에서 재정의)
cookie:
  secure: true
  same-site: None

# Swagger 설정
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
