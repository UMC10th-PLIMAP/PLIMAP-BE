# PLIMAP 공통 환경 설정
# local, dev, prod 등 모든 실행 환경에서 공통으로 사용하는 값만 작성합니다.

spring:
  application:
    name: "PLIMAP"
  # flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Swagger 설정
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
