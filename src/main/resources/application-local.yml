# Local 환경 설정
# IntelliJ 실행 설정의 Active profiles에 local을 지정해야 이 파일이 적용됩니다.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/plimap_local_db
    username: plimap
    password: plimap1234
  # Local JPA/Hibernate 설정
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# Swagger 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
