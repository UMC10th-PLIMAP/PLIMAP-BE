# Local 환경 설정
# IntelliJ 실행 설정의 Active profiles에 local을 지정해야 이 파일이 적용됩니다.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plimap_local_db}
    username: ${DB_USERNAME:plimap}
    password: ${DB_PASSWORD:plimap1234}
  flyway:
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: "http://localhost:8080/oauth/callback/kakao"
  # Local JPA/Hibernate 설정
  jpa:
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        format_sql: true

oauth:
  redirect-uri: "http://localhost:3000/home"

# local은 http(비-HTTPS)라 Secure=true면 쿠키가 아예 전송되지 않음.
# localhost:3000 <-> localhost:8080은 포트만 다른 same-site라 Lax로도 충분
cookie:
  secure: false
  same-site: Lax

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE

# Swagger 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
