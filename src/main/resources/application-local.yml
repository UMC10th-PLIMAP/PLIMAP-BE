# Local 환경 설정
# IntelliJ 실행 설정의 Active profiles에 local을 지정해야 이 파일이 적용됩니다.
spring:
  config:
    import: "optional:file:.env[.properties]"

  # 로컬 PostgreSQL 접속 정보
  datasource:
    url: ${DB_URL} #jdbc:postgresql://localhost:5432/{name}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Local JPA/Hibernate 설정
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
